services:
  db:
    image: postgres:16-alpine
    container_name: hekang-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: hekang
      POSTGRES_PASSWORD: hekang_secret
      POSTGRES_DB: hekang
    ports:
      - "5432:5432"
    volumes:
      - hekang_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hekang -d hekang"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  hekang_pg_data:
